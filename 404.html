<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada — BiblioTech</title>
  <link rel="icon" type="image/png" href="/bibliotech-scouts/img/favicon.png" />
  <style>
    :root {
      color-scheme: light;
      --purple: #6d28d9;
      --navy: #0c1938;
      --sky: #0284c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 180, 216, 0.18), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(255, 183, 3, 0.2), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(109, 40, 217, 0.16), transparent 35%),
        #f8fafc;
    }

    .card {
      width: min(680px, 100%);
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid rgba(109, 40, 217, 0.16);
      border-radius: 28px;
      padding: clamp(2rem, 6vw, 3.5rem);
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.14);
    }

    img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(109, 40, 217, 0.28));
    }

    .code {
      display: inline-block;
      margin: 1rem 0 0.35rem;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--purple);
    }

    h1 {
      margin: 0.35rem 0 0.9rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.15;
    }

    p {
      margin: 0 auto 1.6rem;
      max-width: 44ch;
      color: #475569;
      font-size: 1rem;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    a {
      display: inline-block;
      padding: 0.85rem 1.3rem;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    a:hover { transform: translateY(-2px); }

    .primary {
      color: #ffffff;
      background: linear-gradient(135deg, #6d28d9, #0284c7);
      box-shadow: 0 12px 24px rgba(109, 40, 217, 0.28);
    }

    .secondary {
      color: var(--navy);
      background: #ffffff;
      border: 2px solid #dbeafe;
    }

    a:focus-visible {
      outline: 3px solid #fbbf24;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/bibliotech-scouts/img/logo-flor.png" alt="Flor de Lis Mundial" />
    <span class="code">Error 404</span>
    <h1>Esta página no existe</h1>
    <p>
      Puede que el enlace esté mal escrito o que el contenido se haya movido.
      Vuelve al inicio para seguir consultando la biblioteca y el buscador scout.
    </p>
    <div class="actions">
      <a class="primary" href="/bibliotech-scouts/">Ir a BiblioTech</a>
      <a class="secondary" href="/bibliotech-scouts/#biblioteca">Abrir la biblioteca</a>
    </div>
  </main>
</body>
</html>
